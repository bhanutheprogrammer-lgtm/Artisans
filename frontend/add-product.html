<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtisanLink — Add Product</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>ArtisanLink</h1>
    <p>Add a New Product</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="catalog.html">Gallery</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="login.html">Login</a>
  </nav>

  <main>
    <div class="form-container fade-in-up" style="max-width: 600px;">

      <label for="photoInput">Product Photo</label>
      <input type="file" id="photoInput" accept="image/*">
      <img id="photoPreview" style="width:100%; margin-top:1rem; border-radius:8px; display:none;">

      <label for="material">Material</label>
      <input type="text" id="material" placeholder="e.g. Reclaimed wood">

      <label for="technique">Technique</label>
      <input type="text" id="technique" placeholder="e.g. Hand-carving">

      <button class="btn btn-block" style="margin-top:1.5rem;" onclick="generateListing()">
        ✨ Generate with AI
      </button>

      <div id="aiLoading" style="display:none; margin-top:1rem;">
        <div class="skeleton"></div>
        <div class="skeleton" style="width:70%;"></div>
        <div class="skeleton" style="width:40%;"></div>
        <p style="text-align:center; color:#888;">AI is analyzing your photo...</p>
      </div>

      <div id="aiResults" style="display:none; margin-top:1.5rem; border-top: 2px solid #d7ccc8; padding-top:1.5rem;">
        <span class="badge">AI Generated — Review &amp; Edit Below</span>

        <label for="title">Title</label>
        <input type="text" id="title">

        <label for="description">Description</label>
        <textarea id="description" rows="3"></textarea>

        <label for="category">Category</label>
        <select id="category">
          <option>Jewelry</option>
          <option>Textiles</option>
          <option>Pottery</option>
          <option>Woodwork</option>
          <option>Home Decor</option>
          <option>Accessories</option>
          <option>Art</option>
          <option>Other</option>
        </select>

        <label for="tags">Tags (comma separated)</label>
        <input type="text" id="tags">

        <label for="price">Price</label>
        <input type="text" id="price">

        <button class="btn btn-block" style="margin-top:1.5rem;" onclick="publishProduct()">
          Publish Product
        </button>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 ArtisanLink Collective</p>
  </footer>

  <script src="app.js"></script>
  <script>
    document.getElementById('photoInput').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (evt) {
        const preview = document.getElementById('photoPreview');
        preview.src = evt.target.result;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    function generateListing() {
      document.getElementById('aiLoading').style.display = 'block';
      document.getElementById('aiResults').style.display = 'none';

      fakeGenerateListing().then(result => {
        document.getElementById('aiLoading').style.display = 'none';
        document.getElementById('aiResults').style.display = 'block';

        document.getElementById('title').value = result.title;
        document.getElementById('description').value = result.description;
        document.getElementById('category').value = result.category;
        document.getElementById('tags').value = result.tags.join(', ');
        document.getElementById('price').value = result.suggested_price_range;
      });
    }

    function publishProduct() {
      showToast('Product published! (connect to backend to make this real)');
      setTimeout(() => window.location.href = 'dashboard.html', 1000);
    }
  </script>
</body>
</html>
