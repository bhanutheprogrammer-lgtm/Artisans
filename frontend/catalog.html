<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtisanLink — Catalog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>ArtisanLink</h1>
    <p>Browse handmade creations from artisans worldwide</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="catalog.html">Gallery</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="login.html">Login</a>
  </nav>

  <main>
    <h2 class="section-title">Catalog</h2>

    <div class="filters">
      <input type="text" id="searchInput" placeholder="Search products...">
      <select id="categoryFilter">
        <option value="">All Categories</option>
        <option value="Woodwork">Woodwork</option>
        <option value="Pottery">Pottery</option>
        <option value="Textiles">Textiles</option>
        <option value="Jewelry">Jewelry</option>
        <option value="Home Decor">Home Decor</option>
      </select>
    </div>

    <div class="gallery" id="productGrid">
      <!-- Skeleton loading state, replaced by real cards -->
      <div class="card"><div class="skeleton" style="height:200px; border-radius:0;"></div><div style="padding:1rem;"><div class="skeleton"></div><div class="skeleton" style="width:60%;"></div></div></div>
      <div class="card"><div class="skeleton" style="height:200px; border-radius:0;"></div><div style="padding:1rem;"><div class="skeleton"></div><div class="skeleton" style="width:60%;"></div></div></div>
      <div class="card"><div class="skeleton" style="height:200px; border-radius:0;"></div><div style="padding:1rem;"><div class="skeleton"></div><div class="skeleton" style="width:60%;"></div></div></div>
    </div>

    <div id="emptyState" class="empty-state" style="display:none;">
      <p>No products match your search. Try a different keyword or category.</p>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 ArtisanLink Collective</p>
  </footer>

  <script src="app.js"></script>
  <script>
    let allProducts = [];

    function displayProducts(products) {
      const grid = document.getElementById('productGrid');
      const emptyState = document.getElementById('emptyState');

      if (products.length === 0) {
        grid.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }

      grid.style.display = 'grid';
      emptyState.style.display = 'none';
      grid.innerHTML = products.map(renderProductCard).join('');
    }

    function applyFilters() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const category = document.getElementById('categoryFilter').value;

      const filtered = allProducts.filter(p => {
        const matchesSearch =
          p.title.toLowerCase().includes(searchTerm) ||
          p.tags.join(' ').toLowerCase().includes(searchTerm);
        const matchesCategory = category === '' || p.category === category;
        return matchesSearch && matchesCategory;
      });

      displayProducts(filtered);
    }

    // Load products (mock data for now — swap fetchProducts() in app.js later)
    fetchProducts().then(products => {
      allProducts = products;
      displayProducts(allProducts);
    });

    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('categoryFilter').addEventListener('change', applyFilters);
  </script>
</body>
</html>
