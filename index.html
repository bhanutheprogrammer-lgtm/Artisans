<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artisan Showcase</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #fdf6f0;
      color: #333;
    }

    header {
      background: #8d6e63;
      color: white;
      text-align: center;
      padding: 2rem;
      animation: fadeIn 2s ease-in;
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }

    nav {
      display: flex;
      justify-content: center;
      background: #d7ccc8;
      padding: 1rem;
    }

    nav a {
      margin: 0 1rem;
      text-decoration: none;
      color: #5d4037;
      font-weight: bold;
      transition: transform 0.3s;
    }

    nav a:hover {
      transform: scale(1.2);
      color: #3e2723;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      padding: 2rem;
    }

    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: transform 0.4s ease;
    }

    .card:hover {
      transform: translateY(-10px);
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .card h3 {
      margin: 1rem;
      font-size: 1.2rem;
    }

    .card p {
      margin: 0 1rem 1rem;
      color: #666;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background: #8d6e63;
      color: white;
      animation: fadeInUp 2s ease-in;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <header>
    <h1>Artisan Creations</h1>
    <p>Handmade with love and skill</p>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">Gallery</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>

  <section class="gallery">
    <div class="card">
      <img src="https://via.placeholder.com/300x200" alt="Artisan Work">
      <h3>Wooden Sculpture</h3>
      <p>Crafted from reclaimed wood with intricate details.</p>
    </div>
    <div class="card">
      <img src="https://via.placeholder.com/300x200" alt="Artisan Work">
      <h3>Handmade Pottery</h3>
      <p>Elegant clay pots with traditional designs.</p>
    </div>
    <div class="card">
      <img src="https://via.placeholder.com/300x200" alt="Artisan Work">
      <h3>Textile Art</h3>
      <p>Colorful fabrics woven with care and creativity.</p>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 Artisan Collective</p>
  </footer>

  <script>
    // Simple animation on scroll
    const cards = document.querySelectorAll('.card');
    window.addEventListener('scroll', () => {
      cards.forEach(card => {
        const rect = card.getBoundingClientRect();
        if (rect.top < window.innerHeight - 100) {
          card.style.opacity = 1;
          card.style.transform = 'translateY(0)';
        }
      });
    });
  </script>
</body>
</html>
